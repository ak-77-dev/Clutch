name: clutch

on:
  push:
    paths: ["backend/**", "frontend/**", "desktop/**", "rl-stat-tracker/**", ".github/workflows/clutch.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "desktop/**", "rl-stat-tracker/**", ".github/workflows/clutch.yml"]

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # launcher scanning, Job Objects and paths are Windows-specific
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ../rl-stat-tracker -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=clutch --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
