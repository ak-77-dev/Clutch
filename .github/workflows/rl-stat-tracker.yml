name: rl-stat-tracker

on:
  push:
    paths: ["rl-stat-tracker/**", ".github/workflows/rl-stat-tracker.yml"]
  pull_request:
    paths: ["rl-stat-tracker/**", ".github/workflows/rl-stat-tracker.yml"]

defaults:
  run:
    working-directory: rl-stat-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=rlstats --cov-report=term-missing
      - name: Build demo dashboard
        run: rlstats demo -o demo_dashboard.html
