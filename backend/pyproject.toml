[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clutch"
version = "0.1.0"
description = "Multi-game stats hub API (League of Legends, Valorant, Rocket League, Dota 2, Deadlock)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "rlstats>=2.0",  # ../../rl-stat-tracker — install it first (see README)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
clutch = "clutch.cli:main"

[tool.setuptools.packages.find]
include = ["clutch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["clutch/games/_*_assets.py"]  # generated by scripts/snapshot_assets.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
