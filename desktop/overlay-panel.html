<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
      .panel {
        position: absolute; left: 12px; top: 12px; width: 268px; padding: 12px 14px 12px 16px; color: #f2efea;
        background: rgba(9, 9, 10, .78); border-left: 3px solid #d4ff3a; backdrop-filter: blur(6px);
        clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        opacity: 0; transform: translateX(-12px); transition: opacity .18s, transform .22s cubic-bezier(.2,.8,.2,1);
      }
      .panel.on { opacity: 1; transform: none; }
      .top { display: flex; align-items: center; gap: 8px; font: 600 10px/1 Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; color: #8b877f; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #d4ff3a; box-shadow: 0 0 8px #d4ff3a; }
      .dot.rec { background: #ff3b30; box-shadow: 0 0 8px #ff3b30; }
      .game { font: 900 22px/1.05 Impact, 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: .02em; margin: 6px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .k { font: 500 9px/1 Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; color: #6d6963; }
      .v { font: 800 18px/1.2 Impact, 'Arial Narrow', sans-serif; letter-spacing: .02em; }
      .w { color: #3d8bff; } .l { color: #f2555a; }
      .cap { margin-top: 9px; }
      .bar { height: 4px; background: #232327; margin-top: 4px; }
      .bar i { display: block; height: 100%; background: #d4ff3a; }
      .bar.over i { background: #f2555a; }
      .hint { margin-top: 8px; font: 400 9.5px Consolas, monospace; color: #55524d; }
    </style>
  </head>
  <body>
    <div class="panel" id="panel">
      <div class="top"><span class="dot" id="dot"></span><span id="status">Clutch</span></div>
      <div class="game" id="game"></div>
      <div class="row">
        <div><div class="k">Session</div><div class="v" id="time">—</div></div>
        <div><div class="k">Today</div><div class="v" id="record">—</div></div>
        <div><div class="k">Clips</div><div class="v" id="clips">0</div></div>
      </div>
      <div class="cap" id="cap" hidden>
        <div class="k" id="capLabel"></div>
        <div class="bar" id="capBar"><i id="capFill"></i></div>
      </div>
      <div class="hint" id="hint"></div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id)
      function hours(s) {
        s = Math.max(0, Math.round(s || 0))
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60)
        return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`
      }
      window.render = (data, hotkey) => {
        const p = data && data.playing
        $('panel').classList.toggle('on', Boolean(p))
        if (!p) return
        const b = data.buffer || {}
        $('dot').className = `dot ${b.recording ? 'rec' : ''}`
        $('status').textContent = b.recording ? 'Recording' : b.active ? 'Replay buffer on' : 'Capture off'
        $('game').textContent = p.game_name
        $('time').textContent = hours(p.seconds)
        const t = data.today
        $('record').innerHTML = t ? `<span class="w">${t.wins}W</span> <span class="l">${t.losses}L</span>` : (data.rank || '—')
        $('clips').textContent = data.session_clips || 0
        const cap = data.daily_cap
        $('cap').hidden = !cap
        if (cap) {
          $('capLabel').textContent = `Daily cap · ${cap.value}h / ${cap.target}h`
          $('capFill').style.width = `${Math.min(100, (cap.value / cap.target) * 100)}%`
          $('capBar').className = `bar ${cap.state === 'over' ? 'over' : ''}`
        }
        $('hint').textContent = hotkey ? `${hotkey} to hide` : ''
      }
    </script>
  </body>
</html>
